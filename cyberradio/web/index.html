<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Cyber Radio</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0d14" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="frame">
    <!-- 顶栏 -->
    <header class="bar">
      <div class="brand">
        <span class="logo-dot"></span>
        <span class="logo-text">Cyber<span>Radio</span></span>
      </div>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="conn">CONNECTING</span>
      </div>
    </header>

    <!-- Unlock 横幅 -->
    <section class="unlock" id="unlock" hidden>
      <div>
        <div class="unlock-title">CLICK TO UNLOCK AUDIO</div>
        <div class="unlock-sub">浏览器要求页面有过点击, 才允许播放</div>
      </div>
    </section>

    <!-- 大时钟舱 -->
    <section class="clock-pod">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-meta">
        <div class="clock-day" id="clockDay">—</div>
        <div class="clock-date" id="clockDate">—</div>
        <div class="clock-onair">
          <span class="onair-dot" id="onairDot"></span>
          <span id="onairText">OFF AIR</span>
        </div>
      </div>
    </section>

    <!-- 当前曲目 -->
    <section class="now">
      <div class="now-cover" id="cover"></div>
      <div class="now-meta">
        <div class="now-title" id="title">未在播放</div>
        <div class="now-artist" id="artist">—</div>
        <div class="now-progress">
          <div class="bar"><div class="fill" id="bar"></div></div>
          <div class="time"><span id="t">0:00</span><span id="d">0:00</span></div>
        </div>
        <div class="now-hint" id="hint"></div>
      </div>
    </section>

    <!-- 控制条 -->
    <section class="controls">
      <button class="ctl" id="btnPlay" title="播放/暂停">▶ ❚❚</button>
      <button class="ctl" id="btnSkip" title="下一首">⏭</button>
      <button class="ctl" id="btnStop" title="停止队列">■</button>
      <div class="vol-wrap">
        <span class="vol-label">VOL</span>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1" />
        <span class="vol-num" id="volV">1.00</span>
      </div>
    </section>

    <!-- Tabs -->
    <section class="tabs">
      <button class="tab active" data-tab="queue">QUEUE <span class="badge" id="queueCount">0</span></button>
      <button class="tab" data-tab="history">HISTORY <span class="badge" id="historyCount">0</span></button>
      <button class="tab" data-tab="mix">MIX</button>
    </section>

    <!-- Tab 面板 -->
    <section class="panel" id="panel-queue">
      <ul class="list" id="queueList">
        <li class="empty">— 没有等待中的曲目 —</li>
      </ul>
    </section>

    <section class="panel" id="panel-history" hidden>
      <ul class="list" id="historyList">
        <li class="empty">— 还没有播放历史 —</li>
      </ul>
    </section>

    <section class="panel" id="panel-mix" hidden>
      <div class="mix-row">
        <label>音乐</label>
        <input type="range" id="musicVol" min="0" max="2" step="0.05" value="1" />
        <span id="musicVolV">1.00</span>
      </div>
      <div class="mix-row">
        <label>人声</label>
        <input type="range" id="voiceVol" min="0" max="4" step="0.1" value="2.2" />
        <span id="voiceVolV">2.2</span>
      </div>
      <div class="mix-row">
        <label>降音</label>
        <input type="range" id="duck" min="0" max="1" step="0.05" value="0.25" />
        <span id="duckV">0.25</span>
      </div>
      <div class="mix-row">
        <label>渐变</label>
        <input type="range" id="ramp" min="0" max="2000" step="50" value="600" />
        <span id="rampV">600ms</span>
      </div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <script src="/player.js"></script>
</body>
</html>
